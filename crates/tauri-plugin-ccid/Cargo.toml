[package]
name = "tauri-plugin-ccid"
description = "USB CCID smart-card readers on Android for Chitach"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
links = "tauri-plugin-ccid"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", default-features = false }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

# register_ios_plugin needs the wry runtime on iOS.
[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
