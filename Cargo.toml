[workspace]
resolver = "2"
members = ["crates/celik-core", "crates/celik-export", "crates/celik-sign", "crates/chitach-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/vahidzekic/Chitach"
rust-version = "1.88"
authors = ["Vahid Zekic"]

[workspace.dependencies]
celik-core = { path = "crates/celik-core", default-features = false }
celik-export = { path = "crates/celik-export" }
celik-sign = { path = "crates/celik-sign" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
base64 = "0.22"
pcsc = "2.9"
x509-parser = "0.18"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
