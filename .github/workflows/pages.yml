name: Website

# Publishes site/ to GitHub Pages (https://vahidzekic.github.io/Chitach/).
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/app-icon.png"
      - "docs/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/img
          cp -r site/. _site/
          cp assets/app-icon.png _site/img/
          for f in 02-id-card 03-medical 04-vehicle 05-settings 06-dark-id-card; do
            cp "docs/screenshots/$f.png" _site/img/
          done
          touch _site/.nojekyll
          ls -R _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
