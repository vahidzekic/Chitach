name: Provider links

# Weekly check that the vehicle history services in src-tauri/providers/history.json
# still answer (the fines portals are checked by fines-portals.yml). A failed run means
# a definition needs updating.
on:
  schedule:
    - cron: "47 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check provider pages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-provider-links.mjs
