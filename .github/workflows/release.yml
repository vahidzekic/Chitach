name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0 (created from the selected branch if it does not exist)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag
        id: version
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vX.Y.Z"; exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Write release notes header
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MAC_SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' && 'yes' || '' }}
        shell: bash
        run: |
          if [ -n "$MAC_SIGNED" ]; then
            MAC_SR="macOS verzija je potpisana i notarizovana kod Apple-a."
            MAC_EN="The macOS build is signed and notarized by Apple."
          else
            MAC_SR="macOS verzija nije notarizovana: prvi put otvorite aplikaciju desnim klikom → *Open*
          ili u *System Settings → Privacy & Security* kliknite *Open Anyway*."
            MAC_EN="The macOS build is not notarized: the first time, right-click the app → *Open*,
          or click *Open Anyway* in *System Settings → Privacy & Security*."
          fi
          cat > notes.md <<EOF
          ## Preuzimanje / Download

          | Sistem / OS | Fajl / File |
          |---|---|
          | **Windows 10/11 (x64)** | \`Chitach_${VERSION}_x64-setup.exe\` (preporučeno / recommended) ili / or \`Chitach_${VERSION}_x64_en-US.msi\` |
          | **macOS 10.15+ (Intel i/and Apple Silicon)** | \`Chitach_${VERSION}_universal.dmg\` |
          | **Ubuntu / Debian / Mint (x64)** | \`Chitach_${VERSION}_amd64.deb\` |
          | **Ubuntu / Debian / Raspberry Pi OS (arm64)** | \`Chitach_${VERSION}_arm64.deb\` |
          | **Fedora / RHEL / openSUSE (x64)** | \`Chitach-${VERSION}-1.x86_64.rpm\` |
          | **Fedora / RHEL / openSUSE (arm64)** | \`Chitach-${VERSION}-1.aarch64.rpm\` |
          | **Ostali Linux / Other Linux** | \`Chitach_${VERSION}_amd64.AppImage\` / \`Chitach_${VERSION}_aarch64.AppImage\` |
          | **Komandna linija / Command line** | \`chitach-cli-<os>-<arch>\` |

          **Srpski:** Na Linuksu je potreban servis \`pcscd\` (\`sudo systemctl enable --now pcscd\`).
          ${MAC_SR}
          Windows SmartScreen može prikazati upozorenje: *More info → Run anyway*.
          Detaljno uputstvo: [docs/05-korisnicko-uputstvo.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/05-korisnicko-uputstvo.md).

          **English:** Linux needs the \`pcscd\` service (\`sudo systemctl enable --now pcscd\`).
          ${MAC_EN}
          Windows SmartScreen may warn about an unknown publisher: *More info → Run anyway*.

          EOF
          cat notes.md

      - name: Create (or reuse) draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          find_id() {
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -n1
          }
          id="$(find_id)"
          if [ -z "$id" ]; then
            prerelease=""
            if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
            gh release create "$TAG" \
              --draft $prerelease \
              --target "$GITHUB_SHA" \
              --title "Chitach ${TAG}" \
              --notes-file notes.md \
              --generate-notes
            id="$(find_id)"
          else
            # Re-run: point the (still draft) release at the commit being built.
            gh release edit "$TAG" --target "$GITHUB_SHA"
          fi
          echo "Release id: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin
            cli-name: chitach-cli-macos-universal
          - name: Windows x64
            os: windows-latest
            rust-targets: ""
            tauri-args: ""
            cli-name: chitach-cli-windows-x64.exe
          - name: Linux x64
            os: ubuntu-22.04
            rust-targets: ""
            tauri-args: ""
            cli-name: chitach-cli-linux-x64
          - name: Linux arm64
            os: ubuntu-22.04-arm
            rust-targets: ""
            tauri-args: ""
            cli-name: chitach-cli-linux-arm64
    runs-on: ${{ matrix.os }}
    env:
      # Windows code signing through SignPath (see docs/06-razvoj.md); off until the token exists.
      SIGNPATH: ${{ matrix.os == 'windows-latest' && secrets.SIGNPATH_API_TOKEN != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libpcsclite-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev libxdo-dev pkg-config \
            patchelf file xdg-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Sync version from tag
        shell: bash
        run: node scripts/set-version.mjs "$TAG"

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      # Developer ID signing and notarization, only when the Apple secrets are set
      # (see docs/06-razvoj.md). Without them the build stays ad-hoc signed.
      - name: Set up Apple signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "Apple secrets not set: ad-hoc signing, no notarization."
            exit 0
          fi
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::error::APPLE_SIGNING_IDENTITY is required with APPLE_CERTIFICATE"; exit 1
          fi
          keychain="$RUNNER_TEMP/chitach-signing.keychain-db"
          kc_pass="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

          if [ -n "$APPLE_API_KEY_P8" ]; then
            mkdir -p "$RUNNER_TEMP/private_keys"
            key_path="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
            {
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY=$APPLE_API_KEY"
              echo "APPLE_API_KEY_PATH=$key_path"
            } >> "$GITHUB_ENV"
            echo "Notarization: App Store Connect API key."
          elif [ -n "$APPLE_ID" ]; then
            echo "::add-mask::$APPLE_PASSWORD"
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "Notarization: Apple ID."
          else
            echo "::warning::No notarization credentials: the app is signed but not notarized."
          fi

      - name: Build and upload app bundles
        if: env.SIGNPATH != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tauriScript: npm run tauri
          args: ${{ matrix.tauri-args }}

      - name: Build app bundles (Windows, for signing)
        if: env.SIGNPATH == 'true'
        run: npm run tauri build
        working-directory: ui

      - name: Build CLI (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release -p chitach-cli --target aarch64-apple-darwin
          cargo build --release -p chitach-cli --target x86_64-apple-darwin
          mkdir -p dist-cli
          lipo -create -output "dist-cli/${{ matrix.cli-name }}" \
            target/aarch64-apple-darwin/release/chitach-cli \
            target/x86_64-apple-darwin/release/chitach-cli
          cli="dist-cli/${{ matrix.cli-name }}"
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$cli"
            # A bare binary cannot be stapled, but Gatekeeper finds the ticket online.
            notary=()
            if [ -n "$APPLE_API_KEY_PATH" ]; then
              notary=(--key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
            elif [ -n "$APPLE_ID" ]; then
              notary=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
            fi
            if [ ${#notary[@]} -gt 0 ]; then
              ditto -c -k --keepParent "$cli" "$RUNNER_TEMP/cli.zip"
              xcrun notarytool submit "$RUNNER_TEMP/cli.zip" "${notary[@]}" --wait
            fi
          else
            codesign --force --sign - "$cli"
          fi
          codesign --verify --verbose "$cli"
          lipo -info "$cli"

      - name: Build CLI (Linux / Windows)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cargo build --release -p chitach-cli
          mkdir -p dist-cli
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/chitach-cli.exe "dist-cli/${{ matrix.cli-name }}"
          else
            cp target/release/chitach-cli "dist-cli/${{ matrix.cli-name }}"
            chmod +x "dist-cli/${{ matrix.cli-name }}"
          fi

      - name: Collect unsigned Windows files
        if: env.SIGNPATH == 'true'
        shell: bash
        run: |
          mkdir -p unsigned
          cp target/release/bundle/nsis/*-setup.exe target/release/bundle/msi/*.msi unsigned/
          cp "dist-cli/${{ matrix.cli-name }}" unsigned/
          ls -l unsigned

      - name: Upload unsigned Windows files
        if: env.SIGNPATH == 'true'
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: unsigned/*
          if-no-files-found: error

      - name: Sign with SignPath
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Chitach' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'windows' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Upload signed Windows files to release
        if: env.SIGNPATH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l signed
          gh release upload "$TAG" signed/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload CLI to release
        if: env.SIGNPATH != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "dist-cli/${{ matrix.cli-name }}" --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false > /dev/null
          echo "Published ${TAG}: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
