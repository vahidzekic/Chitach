name: Sign fines definitions

# Signs src-tauri/providers/fines.json on main so installed apps can download it
# (src-tauri/src/fines_defs.rs). Needs the FINES_SIGNING_KEY secret (private key PEM from
# `node scripts/fines-sign.mjs keygen`) and the matching public key in providers/fines.pub.
on:
  push:
    branches: [main]
    paths: ["src-tauri/providers/fines.json", "src-tauri/providers/fines.pub"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fines-sign
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sign
        id: sign
        env:
          FINES_SIGNING_KEY: ${{ secrets.FINES_SIGNING_KEY }}
        run: |
          if [ -z "$FINES_SIGNING_KEY" ]; then
            echo "::notice::FINES_SIGNING_KEY is not set; definitions are not signed (apps keep the embedded ones)."
            exit 0
          fi
          if node scripts/fines-sign.mjs verify; then
            echo "Signature already up to date."
            exit 0
          fi
          node scripts/fines-sign.mjs sign
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Commit signature
        if: steps.sign.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/providers/fines.json.sig
          git commit -m "Sign fines provider definitions"
          git push
