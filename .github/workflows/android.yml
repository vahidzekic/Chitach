name: Android

# Builds a debug APK (installable for testing, not for Google Play) so the
# Android version can be tried on a phone. Nothing is published anywhere.

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  apk:
    name: Debug APK (arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image ships the Android SDK and NDK.
      - name: Android NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI - install
        run: npm ci
        working-directory: ui

      # The Android Studio project (src-tauri/gen/android) is generated here, not
      # committed, until the Android version settles.
      - name: Generate Android project
        run: |
          npm run tauri -- android init --ci
          npm run tauri -- icon src-tauri/icons/icon.png

      - name: Build APK
        run: npm run tauri -- android build --debug --apk --target aarch64 --ci

      - uses: actions/upload-artifact@v4
        with:
          name: chitach-android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
